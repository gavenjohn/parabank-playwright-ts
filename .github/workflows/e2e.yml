name: e2e

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Typecheck before spending time on browsers and containers, so a type
      # error fails in seconds rather than after the whole suite has run.
      - run: npm run typecheck

      # Start the application under test inside the pipeline, so the suite does
      # not depend on the shared public ParaBank instance that other people's
      # test data would break.
      - run: docker compose up -d
      - run: bash scripts/wait-for-parabank.sh

      # No database-init step here on purpose. Creating the schema is the
      # suite's globalSetup, so it happens on a local run too - a CI-only
      # step is what let local and CI drift apart in the first place.
      - run: npx playwright test
        env:
          BASE_URL: http://localhost:8080

      # if: always() - these are most useful precisely when the run failed
      - name: ParaBank container logs
        if: always()
        run: docker compose logs --no-color parabank

      - name: Tomcat logs from inside the container
        if: always()
        run: docker compose exec -T parabank sh -c 'cat /usr/local/tomcat/logs/*.log 2>/dev/null || find / -name "catalina*.log" -o -name "*.log" -path "*tomcat*" 2>/dev/null | head -20'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
