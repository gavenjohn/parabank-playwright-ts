name: e2e

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Start the application under test inside the pipeline, so the suite does
      # not depend on the shared public ParaBank instance that other people's
      # test data would break.
      - run: docker compose up -d
      - run: bash scripts/wait-for-parabank.sh
  
       
      # The image ships with an empty schema - the Parameter table does not exist
      # until this runs, and every page that reads it returns 500. Locally this
      # was done once by clicking Initialize on the admin page.
      # -f is omitted deliberately: db.htm returns a non-2xx status even on
      # success, so failing the step on it would be wrong.
      - run: curl -sS -X POST -d "action=INIT" http://localhost:8080/parabank/db.htm -o /dev/null -w "init returned %{http_code}\n"

      - run: npx playwright test
        env:
          BASE_URL: http://localhost:8080

      # if: always() - these are most useful precisely when the run failed
      - name: ParaBank container logs
        if: always()
        run: docker compose logs --no-color parabank

      - name: Tomcat logs from inside the container
        if: always()
        run: docker compose exec -T parabank sh -c 'cat /usr/local/tomcat/logs/*.log 2>/dev/null || find / -name "catalina*.log" -o -name "*.log" -path "*tomcat*" 2>/dev/null | head -20'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7