name: e2e

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Start the application under test inside the pipeline, so the suite does
      # not depend on the shared public ParaBank instance that other people's
      # test data would break.
      - run: docker compose up -d
      - run: bash scripts/wait-for-parabank.sh

      # The homepage renders as soon as Tomcat deploys the WAR, but the in-process
      # HSQLDB instance takes longer. A fixed wait is normally the wrong instinct;
      # for one-time environment startup, as opposed to inside a test, it is the
      # honest tool.
      

      - name: Initialise the ParaBank database
        run: |
          # db.htm is the first stateful request the container sees in CI. Loading
          # the admin page first establishes the session it binds against - the
          # same requirement register.htm has.
          curl -fsS -c cookies.txt http://localhost:8080/parabank/admin.htm > /dev/null
          curl -v -fsS -b cookies.txt -X POST -d "action=INIT" http://localhost:8080/parabank/db.htm

      - run: npx playwright test
        env:
          BASE_URL: http://localhost:8080

      # if: always() - these are most useful precisely when the run failed
      - name: ParaBank container logs
        if: always()
        run: docker compose logs --no-color parabank

      - name: Tomcat logs from inside the container
        if: always()
        run: docker compose exec -T parabank sh -c 'cat /usr/local/tomcat/logs/*.log 2>/dev/null || find / -name "catalina*.log" -o -name "*.log" -path "*tomcat*" 2>/dev/null | head -20'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7