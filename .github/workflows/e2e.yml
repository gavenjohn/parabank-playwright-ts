name: e2e

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Start the application under test inside the pipeline, so the suite does
      # not depend on the shared public ParaBank instance that other people's
      # test data would break.
      - run: docker compose up -d
      - run: bash scripts/wait-for-parabank.sh

      # The container ships with an empty database. Registration writes to it and
      # returns a 500 until it has been initialised. Locally this was done once by
      # clicking Initialize on the admin page; CI needs it as an explicit step.
      - run: curl -fsS -X POST -d "action=INIT" http://localhost:8080/parabank/db.htm

      - run: npx playwright test
        env:
          BASE_URL: http://localhost:8080

      # if: always() - the report is most useful precisely when the run failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7